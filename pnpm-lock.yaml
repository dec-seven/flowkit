lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .: {}

  examples/mock-vue2:
    dependencies:
      '@flowkit/adapter-mock':
        specifier: workspace:*
        version: link:../../packages/adapter-mock
      '@flowkit/core':
        specifier: workspace:*
        version: link:../../packages/core
      '@flowkit/headless':
        specifier: workspace:*
        version: link:../../packages/headless

  packages/adapter-mock:
    dependencies:
      '@flowkit/core':
        specifier: workspace:*
        version: link:../core

  packages/core: {}

  packages/form: {}

  packages/headless:
    dependencies:
      '@flowkit/core':
        specifier: workspace:*
        version: link:../core
